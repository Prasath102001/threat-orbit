<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threat Orbit</title>
<meta name="description" content="Trace any IP address or domain to where it lives: a cinematic globe with real BGP routes, multi-source geolocation consensus, risk signals and a 3D ground view.">
<meta name="theme-color" content="#05040b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..800&family=Chakra+Petch:wght@400;500;600;700&family=Kode+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #05040b;
    --ink-2: #0b0918;
    --glass: rgba(14, 11, 32, 0.62);
    --glass-2: rgba(20, 16, 44, 0.78);
    --hair: rgba(190, 175, 255, 0.12);
    --hair-2: rgba(190, 175, 255, 0.22);
    --violet: #8b5cff;
    --violet-2: #b49bff;
    --ion: #3df2e0;
    --coral: #ff5a4e;
    --amber: #ffc857;
    --text: #ece9ff;
    --dim: #9a93bf;
    --faint: #5d5781;
    --display: 'Tektur', 'Chakra Petch', system-ui, sans-serif;
    --sans: 'Chakra Petch', system-ui, -apple-system, Segoe UI, sans-serif;
    --mono: 'Kode Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    font-variant-numeric: tabular-nums; text-rendering: optimizeLegibility; }
  button { font: inherit; color: inherit; }
  ::selection { background: rgba(139, 92, 255, .45); }

  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: linear-gradient(0deg, rgba(5,4,11,.92) 0%, rgba(5,4,11,.55) 18%, transparent 38%),
                radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(5,4,11,.85) 100%); }
  .grain { position: fixed; inset: -50%; pointer-events: none; z-index: 1; opacity: .05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 33%{transform:translate(-3%,2%)} 66%{transform:translate(2%,-3%)} 100%{transform:translate(0,0)} }

  /* ---------- chrome ---------- */
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 22px 28px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .mark { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
  .mark-word { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .02em; }
  .mark-word span { color: var(--violet-2); }
  .meta { display: flex; gap: 22px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .02em; color: var(--dim); text-transform: uppercase; }
  .meta b { color: var(--text); font-weight: 500; }
  .meta .pulse { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ion); box-shadow: 0 0 10px var(--ion); margin-right: 8px; vertical-align: 1px; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .3; transform: scale(.7); } }

  /* ---------- hero / search ---------- */
  .dock { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 12; width: min(640px, calc(100% - 32px)); display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .hero { text-align: center; transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .hero h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(28px, 3.8vw, 48px); letter-spacing: -.01em; line-height: 1.05; }
  .hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--violet-2), var(--ion)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 14px 0 0; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--dim); text-transform: uppercase; }
  body.traced .hero { opacity: 0; transform: translateY(14px); pointer-events: none; height: 0; overflow: hidden; margin-top: -18px; }

  .search { position: relative; width: 100%; }
  .search form { display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 8px 0 22px; border-radius: 30px;
    background: var(--glass); border: 1px solid var(--hair-2); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 20px 60px -20px rgba(139, 92, 255, .45), inset 0 1px 0 rgba(255,255,255,.06); transition: border-color .3s, box-shadow .3s; }
  .search form:focus-within { border-color: rgba(180, 155, 255, .6); box-shadow: 0 20px 70px -15px rgba(139, 92, 255, .7), 0 0 0 4px rgba(139, 92, 255, .14); }
  .search .glyph { flex: none; width: 18px; height: 18px; color: var(--violet-2); }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-family: var(--mono); font-size: 16px; letter-spacing: 0; }
  .search input::placeholder { color: var(--faint); }
  .search kbd { font-family: var(--mono); font-size: 11px; color: var(--faint); border: 1px solid var(--hair-2); border-radius: 6px; padding: 2px 7px; }
  .go { flex: none; height: 42px; padding: 0 22px; border: 0; border-radius: 22px; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
    color: #0b0718; background: linear-gradient(100deg, var(--violet-2), var(--ion)); box-shadow: 0 6px 26px -6px rgba(61, 242, 224, .55); transition: transform .2s var(--ease), filter .2s; }
  .go:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .go:disabled { filter: saturate(.3) brightness(.8); cursor: progress; }
  .search.busy form::after { content: ""; position: absolute; left: 22px; right: 22px; bottom: -1px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--ion), var(--violet), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: sweep 1s linear infinite; }
  @keyframes sweep { from { background-position: -50% 0; } to { background-position: 150% 0; } }

  .suggest { position: absolute; left: 0; right: 0; bottom: calc(100% + 10px); padding: 8px; border-radius: 18px; background: var(--glass-2); border: 1px solid var(--hair-2);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .2s, transform .2s var(--ease); max-height: 50vh; overflow: auto; }
  .suggest.open { opacity: 1; transform: none; pointer-events: auto; }
  .suggest h6 { margin: 8px 12px 6px; font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .04em; color: var(--faint); }
  .suggest button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 9px 12px; border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left; }
  .suggest button:hover, .suggest button.hl { background: rgba(139, 92, 255, .14); }
  .suggest .q { font-family: var(--mono); font-size: 13px; }
  .suggest .n { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ticker { height: 16px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0; color: var(--dim); display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden; max-width: 100%; }
  .ticker i { width: 5px; height: 5px; border-radius: 50%; background: var(--ion); box-shadow: 0 0 8px var(--ion); flex: none; }
  .ticker.err i { background: var(--coral); box-shadow: 0 0 8px var(--coral); }
  .ticker span { overflow: hidden; text-overflow: ellipsis; }

  /* ---------- target reticle (projected) ---------- */
  .reticle { position: fixed; left: 0; top: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .5s; will-change: transform; }
  .reticle.on { opacity: 1; }
  .reticle svg { position: absolute; left: -34px; top: -34px; animation: spin 9s linear infinite; }
  .reticle .tag { position: absolute; left: 40px; top: -40px; white-space: nowrap; font-family: var(--mono); font-size: 11px; letter-spacing: 0; color: var(--text);
    padding: 5px 9px 5px 10px; border-left: 2px solid var(--ion); background: linear-gradient(90deg, rgba(61,242,224,.14), transparent); }
  .reticle .tag b { display: block; color: var(--ion); font-weight: 500; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- result card ---------- */
  .card { position: fixed; z-index: 11; right: max(24px, 4vw); top: calc(50% - 30px); width: min(460px, 38vw); max-height: calc(100vh - 230px); overflow: auto; overscroll-behavior: contain;
    padding: 28px 30px 8px; border-radius: 24px; background: linear-gradient(160deg, rgba(14,11,32,.72), rgba(5,4,11,.62)); border: 1px solid var(--hair);
    backdrop-filter: blur(14px) saturate(130%); -webkit-backdrop-filter: blur(14px) saturate(130%); box-shadow: 0 40px 120px -40px rgba(0,0,0,.9);
    transform: translate(30px, -50%); opacity: 0; pointer-events: none; transition: opacity .7s var(--ease), transform .9s var(--ease); scrollbar-width: none; }
  .card::-webkit-scrollbar { display: none; }
  .card.on { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
  .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; color: var(--ion); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--ion); box-shadow: 0 0 8px var(--ion); }
  .ip { margin: 12px 0 6px; font-family: var(--display); font-weight: 700; font-size: 52px; line-height: 1; letter-spacing: -.01em; white-space: nowrap;
    background: linear-gradient(180deg, #fff 30%, var(--violet-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ip.v6 { letter-spacing: -.02em; white-space: normal; word-break: break-all; }
  .query { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .place { margin-top: 16px; display: flex; align-items: center; gap: 12px; font-size: clamp(18px, 1.7vw, 22px); font-weight: 600; letter-spacing: 0; line-height: 1.25; }
  .place .flag { position: relative; flex: none; display: inline-flex; border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.22), 0 6px 18px -6px rgba(0,0,0,.8), 0 0 18px -4px rgba(180,155,255,.35); }
  .place .flag img { display: block; height: 24px; width: auto; max-width: 44px; }
  .place .flag::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.22), transparent 45%, rgba(0,0,0,.18)); } /* soft glass sheen */
  .org { margin-top: 8px; font-size: 14px; color: var(--dim); }
  .org b { color: var(--violet-2); font-weight: 500; font-family: var(--mono); }
  .sunline { margin-top: 14px; display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px 9px; padding: 7px 12px 7px 10px; border-radius: 12px; font-size: 12.5px; line-height: 1.35; }
  .sunline svg { width: 16px; height: 16px; flex: none; }
  .sunline b { font-weight: 600; }
  .sunline span { color: var(--dim); font-family: var(--mono); font-size: 11.5px; letter-spacing: 0; }
  .sunline.is-day { color: #ffd27a; background: linear-gradient(90deg, rgba(255,190,90,.16), rgba(255,190,90,.03)); border: 1px solid rgba(255,190,90,.35); }
  .sunline.is-dusk { color: #ffa36b; background: linear-gradient(90deg, rgba(255,120,70,.16), rgba(139,92,255,.06)); border: 1px solid rgba(255,140,80,.35); }
  .sunline.is-night { color: var(--violet-2); background: linear-gradient(90deg, rgba(139,92,255,.16), rgba(139,92,255,.03)); border: 1px solid rgba(180,155,255,.32); }
  .reticle .tag b[data-phase]::after { content: " · " attr(data-phase); color: #ffd27a; }
  .stats { margin-top: 22px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .stat { padding: 14px 0 14px 14px; border-left: 1px solid var(--hair); }
  .stat:first-child { border-left: 0; padding-left: 0; }
  .stat small { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .03em; color: var(--dim); text-transform: uppercase; margin-bottom: 6px; }
  .stat b { font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: -.01em; }
  .stat em { font-style: normal; font-size: 11px; color: var(--dim); margin-left: 3px; }

  .risk { margin-top: 22px; }
  .risk-row { display: flex; align-items: center; gap: 14px; }
  .risk-label { font-family: var(--mono); font-size: 11px; letter-spacing: .03em; color: var(--dim); width: 40px; }
  .bars { display: flex; gap: 4px; flex: 1; }
  .bars i { flex: 1; height: 14px; border-radius: 2px; background: rgba(190,175,255,.1); transform-origin: bottom; transform: scaleY(.35); transition: transform .5s var(--ease), background .5s; }
  .bars i.lit { transform: scaleY(1); }
  .risk-word { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; min-width: 92px; text-align: right; }
  .chips { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { font-family: var(--mono); font-size: 11px; letter-spacing: .02em; text-transform: uppercase; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--hair-2); color: var(--dim); }
  .chip.ion { color: var(--ion); border-color: rgba(61,242,224,.4); background: rgba(61,242,224,.06); }
  .chip.vio { color: var(--violet-2); border-color: rgba(180,155,255,.45); background: rgba(139,92,255,.08); }
  .chip.hot { color: #ffb1aa; border-color: rgba(255,90,78,.5); background: rgba(255,90,78,.1); }
  .chip.warm { color: var(--amber); border-color: rgba(255,200,87,.45); background: rgba(255,200,87,.07); }

  .actions { margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--hair-2); background: rgba(255,255,255,.02);
    font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; text-decoration: none; color: var(--text); transition: border-color .2s, background .2s, transform .2s var(--ease); }
  .btn:hover { border-color: var(--violet-2); background: rgba(139,92,255,.12); transform: translateY(-1px); }
  .btn.primary { border-color: transparent; background: linear-gradient(100deg, rgba(139,92,255,.9), rgba(61,242,224,.85)); color: #0b0718; font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn svg { width: 14px; height: 14px; }

  .more { margin-top: 22px; border-top: 1px solid var(--hair); }
  .more summary { list-style: none; cursor: pointer; padding: 14px 0; font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
  .more summary::-webkit-details-marker { display: none; }
  .more summary::after { content: "+"; font-size: 16px; color: var(--violet-2); transition: transform .3s var(--ease); }
  .more[open] summary::after { transform: rotate(45deg); }
  .sec { padding: 4px 0 16px; }
  .sec h4 { margin: 0 0 10px; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--violet-2); }
  .kv { display: grid; grid-template-columns: 112px 1fr; gap: 8px 12px; font-size: 13.5px; line-height: 1.4; }
  .kv dt { font-family: var(--mono); font-size: 11px; letter-spacing: .02em; color: var(--dim); text-transform: uppercase; padding-top: 2px; }
  .kv dd { margin: 0; color: var(--text); word-break: break-word; }
  .kv dd code { font-family: var(--mono); font-size: 12px; color: var(--violet-2); }
  .path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; }
  .path span { padding: 3px 8px; border-radius: 6px; background: rgba(139,92,255,.1); border: 1px solid rgba(139,92,255,.25); }
  .path span.origin { background: rgba(61,242,224,.1); border-color: rgba(61,242,224,.35); color: var(--ion); }
  .path i { color: var(--faint); font-style: normal; }
  .ports { display: flex; flex-wrap: wrap; gap: 5px; }
  .ports span { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--hair-2); color: var(--text); }
  .ports span small { color: var(--faint); font-size: 9.5px; margin-left: 4px; }
  .src { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px 10px; align-items: center; font-size: 13px; }
  .src i { width: 8px; height: 8px; border-radius: 50%; }
  .src em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .shimmer { display: inline-block; height: 10px; width: 120px; border-radius: 4px; background: linear-gradient(90deg, rgba(190,175,255,.06), rgba(190,175,255,.18), rgba(190,175,255,.06)); background-size: 200% 100%; animation: shim 1.2s linear infinite; vertical-align: middle; }
  @keyframes shim { to { background-position: -200% 0; } }
  .fine { margin-top: 10px; font-size: 11.5px; line-height: 1.6; color: var(--faint); }
  .fine a { color: var(--dim); }

  .reveal > * { opacity: 0; transform: translateY(10px); }
  .card.on .reveal > * { animation: rise .7s var(--ease) forwards; }
  .card.on .reveal > *:nth-child(2) { animation-delay: .08s; } .card.on .reveal > *:nth-child(3) { animation-delay: .16s; }
  .card.on .reveal > *:nth-child(4) { animation-delay: .24s; } .card.on .reveal > *:nth-child(5) { animation-delay: .32s; }
  .card.on .reveal > *:nth-child(6) { animation-delay: .40s; } .card.on .reveal > *:nth-child(7) { animation-delay: .48s; }
  .card.on .reveal > *:nth-child(8) { animation-delay: .56s; } .card.on .reveal > *:nth-child(9) { animation-delay: .62s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ---------- ground view ---------- */
  #ground { position: fixed; inset: 0; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 1s var(--ease); background: var(--ink); }
  #ground.on { opacity: 1; pointer-events: auto; }
  #groundMap { position: absolute; inset: 0; }
  .ground-ui { position: absolute; z-index: 2; left: 28px; top: 22px; right: 28px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; pointer-events: none; }
  .ground-ui > * { pointer-events: auto; }
  .ground-title .eyebrow { margin-bottom: 8px; }
  .ground-title h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(22px, 2.8vw, 36px); letter-spacing: -.01em; line-height: 1.05; }
  .ground-title p { margin: 8px 0 0; font-family: var(--mono); font-size: 12px; color: var(--dim); letter-spacing: 0; }
  .legend { position: absolute; z-index: 2; left: 28px; bottom: 28px; padding: 14px 16px; border-radius: 14px; background: var(--glass-2); border: 1px solid var(--hair-2); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 12.5px; max-width: min(360px, calc(100% - 56px)); }
  .legend h5 { margin: 0 0 10px; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--violet-2); }
  .pin { position: relative; width: 0; height: 0; }
  .pin b { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--ion); box-shadow: 0 0 0 3px rgba(5,4,11,.8), 0 0 24px var(--ion); }
  .pin i { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ion); animation: ping 2s var(--ease) infinite; }
  .pin i:nth-child(2) { animation-delay: 1s; }
  @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(6); opacity: 0; } }
  .maplibregl-ctrl-attrib { background: rgba(5,4,11,.6) !important; color: var(--faint); font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: var(--dim) !important; }
  .maplibregl-ctrl-attrib-button { filter: invert(1) opacity(.5); }

  .mode { position: fixed; z-index: 25; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; padding: 4px; border-radius: 22px;
    background: var(--glass-2); border: 1px solid var(--hair-2); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .mode button { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border: 0; border-radius: 18px; background: none; cursor: pointer;
    font-family: var(--sans); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); transition: color .2s, background .2s; }
  .mode button svg { width: 13px; height: 13px; }
  .mode button:hover { color: var(--text); }
  .mode button.on { color: #0b0718; background: linear-gradient(100deg, var(--violet-2), var(--ion)); }
  .mode.loading button.on { animation: breathe 1s ease-in-out infinite; }
  @media (max-width: 860px) {
    .mode { top: 62px; }
    .mode button { padding: 0 11px; gap: 0; font-size: 0; letter-spacing: 0; }
    .mode button svg { width: 15px; height: 15px; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const RAD = Math.PI / 180;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isNarrow = () => innerWidth <= 860;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

const C = { violet: new THREE.Color('#8b5cff'), violet2: new THREE.Color('#b49bff'), ion: new THREE.Color('#3df2e0'), coral: new THREE.Color('#ff5a4e'), ink: new THREE.Color('#07051a') };

/* ===================================================================== */
/*  Geometry helpers                                                     */
/* ===================================================================== */
// lat/lon -> point on a sphere (same convention used everywhere below)
function ll2v(lat, lon, r = 1) {
  const phi = (90 - lat) * RAD, th = lon * RAD;
  return new THREE.Vector3(r * Math.sin(phi) * Math.sin(th), r * Math.cos(phi), r * Math.sin(phi) * Math.cos(th));
}
function haversine(a, b) {
  const dLat = (b.lat - a.lat) * RAD, dLon = (b.lon - a.lon) * RAD;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(Math.min(1, h)));
}
function subsolar(date) {
  const d = (date.getTime() - Date.UTC(2000, 0, 1, 12)) / 864e5;
  const g = (357.529 + 0.98560028 * d) * RAD, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD, e = (23.439 - 0.00000036 * d) * RAD;
  const dec = Math.asin(Math.sin(e) * Math.sin(L)) / RAD;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) / RAD;
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  return { lat: dec, lon: ((ra - gmst * 15) % 360 + 540) % 360 - 180 };
}

/* ===================================================================== */
/*  Renderer / scene                                                     */
/* ===================================================================== */
const canvas = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
// shaders below author colours directly in display space, so skip the final sRGB encode
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(new THREE.Color().setRGB(5 / 255, 4 / 255, 11 / 255, THREE.LinearSRGBColorSpace), 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 200);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false; controls.minDistance = 1.25; controls.maxDistance = 9;
controls.rotateSpeed = 0.45; controls.zoomSpeed = 0.7;
controls.autoRotate = !REDUCED; controls.autoRotateSpeed = 0.35;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.45, 0.22);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const earth = new THREE.Group();
scene.add(earth);
const uTime = { value: 0 };
const sunDir = new THREE.Vector3();
const sunHooks = [];
function updateSun() { const s = subsolar(new Date()); sunDir.copy(ll2v(s.lat, s.lon)).normalize(); sunHooks.forEach(f => f()); }
updateSun(); setInterval(updateSun, 60000);

// --- core sphere (occludes the far side, carries a soft violet rim) ---
const core = new THREE.Mesh(new THREE.SphereGeometry(0.992, 96, 96), new THREE.ShaderMaterial({
  uniforms: { uSun: { value: sunDir } },
  vertexShader: `varying vec3 vN; varying vec3 vW; void main(){ vN = normalize(normalMatrix*normal); vW = normalize((modelMatrix*vec4(position,1.)).xyz); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 uSun; varying vec3 vN; varying vec3 vW;
    void main(){
      float rim = pow(1. - max(dot(vN, vec3(0.,0.,1.)), 0.), 3.);
      float sd = dot(vW, uSun);
      float day = smoothstep(-.25, .55, sd);
      vec3 base = mix(vec3(.016,.011,.05), vec3(.045,.06,.15), day);
      vec3 rimCol = mix(vec3(.3,.2,.8) * .55, vec3(.45,.7,1.), day) + vec3(1.,.5,.22) * exp(-pow(sd / .2, 2.)) * .45;
      gl_FragColor = vec4(base + rim * rimCol * .35, 1.);
    }`
}));
earth.add(core);

// --- atmosphere halo (back faces, additive) ---
const halo = new THREE.Mesh(new THREE.SphereGeometry(1.22, 96, 96), new THREE.ShaderMaterial({
  side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  uniforms: { uSun: { value: sunDir } },
  vertexShader: `varying vec3 vN; varying vec3 vWN;
    void main(){ vN = normalize(normalMatrix*normal); vWN = normalize((modelMatrix*vec4(normal,0.)).xyz); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  // back faces: view-space z runs from ~-0.57 at the globe's limb to 0 at the halo's edge.
  // Sunlit limb scatters sky-blue, the day/night edge glows warm, the night limb stays a dim violet.
  fragmentShader: `uniform vec3 uSun; varying vec3 vN; varying vec3 vWN; void main(){
      float i = pow(clamp(-vN.z * 1.75, 0., 1.), 2.6);
      float l = dot(vWN, uSun);
      float day = smoothstep(-.35, .5, l);
      float dusk = exp(-pow(l / .24, 2.));
      vec3 col = mix(vec3(.36, .24, .82) * .4, vec3(.5, .76, 1.) * 1.1, day) + vec3(1., .52, .24) * dusk * .5;
      gl_FragColor = vec4(col * i, 1.); }`
}));
scene.add(halo);

// --- stars ---
{
  const n = 1800, pos = new Float32Array(n * 3), sz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(40 + Math.random() * 30);
    pos.set([v.x, v.y, v.z], i * 3); sz[i] = Math.random();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aS', new THREE.BufferAttribute(sz, 1));
  const stars = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uTime, uPR: { value: renderer.getPixelRatio() } },
    vertexShader: `attribute float aS; uniform float uTime; uniform float uPR; varying float vA;
      void main(){ vA = .25 + .55*aS*(.6+.4*sin(uTime*.8 + aS*60.)); gl_PointSize = (0.6 + aS*1.6)*uPR; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord-.5); if(d>.5) discard; gl_FragColor = vec4(vec3(.85,.82,1.), vA*smoothstep(.5,.0,d)); }`
  }));
  scene.add(stars);
}

// --- orbit ring with a lone satellite ---
const orbit = new THREE.Group();
{
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.0016, 6, 256), new THREE.MeshBasicMaterial({ color: 0x6b4dff, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));

async function enrich(T, id) {

  tasks.push(getJSON('internetdb', `https://internetdb.shodan.io/${ip}`).then(j => { T.idb = j && j.ip ? j : null; upd(); }));
  tasks.push(getJSON('ipsnapshot', `https://ipsnapshot.com/api/ip/${ip}`).then(j => { T.snap = j?.data || null; upd(); }));
  tasks.push(getJSON('onionoo', `https://onionoo.torproject.org/details?search=${encodeURIComponent(ip)}&limit=1&fields=flags,running`).then(j => {

  tasks.push(getJSON('routing', `https://stat.ripe.net/data/routing-status/data.json?resource=${ip}`).then(j => {
    const v = j?.data?.visibility?.[ip.includes(':') ? 'v6' : 'v4'];

  if (!q) { toast('Type an IP address or a domain first.'); return; }
  await trace(q);
  if (state.T) hist.add(normalize(q), [state.T.geo.city, state.T.geo.cc].filter(Boolean).join(', '));
}
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); input.select(); }
  if (e.key === 'Escape') { if ($('ground').classList.contains('on')) ascend(); else input.blur(); }
});
canvas.addEventListener('pointerdown', () => { controls.autoRotate = false; });

/* ===================================================================== */
/*  Boot                                                                 */
/* ===================================================================== */
setInterval(() => { $('utc').textContent = new Date().toISOString().slice(11, 19); }, 1000);
$('utc').textContent = new Date().toISOString().slice(11, 19);
// opening shot: look at the night side with the sun rising behind the limb
function sunriseShot() {
  const s = subsolar(new Date());
  return ll2v(clamp(-s.lat * .5 + 14, -40, 40), s.lon + 180 - 32, idleDistance());
}
camera.position.copy(sunriseShot());
camera.lookAt(0, 0, 0);
resize();
view.offY = view.offYTarget;
requestAnimationFrame(frame);
buildDots().finally(() => setTimeout(() => $('boot').classList.add('done'), 200));
buildLines();
try { if (localStorage.getItem(MODE_KEY) === 'sat') setMode(true, false); } catch {}
addEventListener('keydown', e => {
  if ((e.key === 's' || e.key === 'S') && document.activeElement !== input && !e.metaKey && !e.ctrlKey) setMode(!view.sat);
});

const deep = new URLSearchParams(location.search).get('ip');
geoSources['ipwho.is']('').then(d => d || geoSources['ipapi.co']('')).then(d => {
  if (d) {
    setMe(d);
  } else $('youMeta').textContent = 'LOCATION UNKNOWN';
}).finally(() => { if (deep) { input.value = deep; go(); } });
window.threatOrbit = { state, camera, controls, bloom, dotsMat, renderer, composer }; // for poking around in devtools
</script>
